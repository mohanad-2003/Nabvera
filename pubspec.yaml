name: nabvera
description: "Nabvera — workouts, nutrition, and progress tracking in one premium fitness app."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.0.4
  google_sign_in: 6.2.2
  http: ^1.6.0
  http_parser: ^4.1.2
  video_player: ^2.14.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^22.3.0
  image_picker: ^1.1.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  health: ^13.3.2
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  purchases_flutter: ^9.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  build_runner: ^2.4.13
  riverpod_generator: ^4.0.4
  freezed: ^3.2.3
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
      - assets/
      - assets/onboarding/
      - assets/png/
      - assets/bottom/home.png
      - assets/bottom/workout.png
      - assets/bottom/nutrition.png
      - assets/bottom/community.png
      - assets/bottom/profile.png

flutter_launcher_icons:
  android: true
  ios: true
  # Flat/legacy Android icon + iOS icon: opaque, logo padded to ~68% of the
  # canvas so it isn't clipped by iOS's own corner-rounding.
  image_path: assets/logo/icon_flat.png
  # Adaptive Android icon (API 26+): transparent foreground padded to ~60%
  # so the mark survives the launcher's circular/squircle/rounded-square
  # mask crop instead of losing its edges — the previous config reused the
  # raw un-padded logo (content ~99% of the canvas) for both, which is why
  # the installed icon looked cropped/unpolished.
  # White, not the app's dark-navy brand color — Android auto-shows this
  # icon centered over a plain white backdrop as the cold-start splash on
  # API 31+, and a dark card there read as a jarring, mismatched box.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/icon_foreground.png

